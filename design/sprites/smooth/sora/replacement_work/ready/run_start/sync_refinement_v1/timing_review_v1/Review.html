<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sora run-start review</title>
<style>
body{margin:0;background:#151923;color:#edf0f7;font:16px system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px}h1{font-size:25px;margin:0 0 8px}
p{color:#b9c1d4;line-height:1.5}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}
button,select{background:#2b354c;color:inherit;border:1px solid #53607b;border-radius:7px;padding:10px 15px}
button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffd666}
.views{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.sprite{background-color:#d4d7dc;background-image:conic-gradient(#eee 25%,transparent 0 50%,#eee 0 75%,transparent 0);background-size:32px 32px;border-radius:8px}
.large{width:min(512px,100%);height:auto}.small{width:128px;height:128px}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:20px}.thumbs button{padding:2px;min-width:0}
.thumbs img{display:block;width:100%;height:auto}.thumbs button[aria-pressed=true]{border:3px solid #ffd666}
input[type=range]{width:min(400px,90vw)}output{min-width:220px}.caption{font-size:13px;margin:5px 0}
@media(max-width:600px){main{padding:12px}.thumbs{grid-template-columns:repeat(4,1fr)}}
</style>
<main><h1>Sora: run start</h1><p>12 complete poses. Play once, or scrub to compare the lift and first step.</p>
<div class="controls"><button id="play">Play once</button><button id="pause">Pause</button>
<label>Speed <select id="speed"><option value="1">Normal</option><option value="3">Slow</option></select></label>
<label>Frame <input id="scrub" type="range" min="0" max="11" value="0"></label><output id="readout"></output></div>
<div class="views"><div><img id="large" class="sprite large" width="512" height="512" alt="Sora run-start pose"><p class="caption">Working canvas</p></div>
<div><img id="small" class="sprite small" width="128" height="128" alt="Same complete pose at game export size"><p class="caption">128 px preview</p></div></div>
<div id="thumbs" class="thumbs"></div><p>Artwork quality is retained. New intermediate drawings and consistent weapon projection are still needed at the larger gaps.</p></main>
<script>
const frames=[{"index":0,"phase":"Ready","durationMs":100,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_00.png","sha256":"6687a5dba50ed1cd0bcb470bad234055ad63dda4a85bfefd94ccb552b5f47fbf","file":"frame_00.png","bounds":[80,129,416,470]},{"index":1,"phase":"Release near hand","durationMs":80,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_01.png","sha256":"67cec567b7f91cb2a9a76bb63396904b0c9b04dd015ce4942ed06415059e9b28","file":"frame_01.png","bounds":[65,126,435,470]},{"index":2,"phase":"Early lift","durationMs":80,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_02.png","sha256":"8a4464887eb74cc188ff236f2972d7ebe579db30655c6bb53cb05e43ae9ef062","file":"frame_02.png","bounds":[88,33,429,470]},{"index":3,"phase":"Upright lift","durationMs":60,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_03.png","sha256":"09ea63761142fdf41c008959df7266ff548d5861b56cc8b0082ff1d70d94db4f","file":"frame_03.png","bounds":[91,21,426,470]},{"index":4,"phase":"Turn overhead","durationMs":70,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_04.png","sha256":"e81a5c452a03a4fffde739c4ed4a977ab7dc70cd537ab7fd67fe4dab903120f1","file":"frame_04.png","bounds":[91,18,452,470]},{"index":5,"phase":"Lower into carry","durationMs":75,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_05.png","sha256":"16e4107acd7099c62523270010d843b40d1d9754162a4e7693c7fd4a0d7be744","file":"frame_05.png","bounds":[88,36,456,470]},{"index":6,"phase":"Settle carry","durationMs":75,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_06.png","sha256":"17d0964826c61b6f345a3cd9bbca70d29804d6d8fac2bc84fe210414c44495f3","file":"frame_06.png","bounds":[90,109,447,470]},{"index":7,"phase":"Prepare drive","durationMs":65,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_07.png","sha256":"af0faeab9fc25c81feea7a4929b1287c5ac2d659786012fa179e12b7bbb056da","file":"frame_07.png","bounds":[87,112,451,470]},{"index":8,"phase":"Forward lean","durationMs":65,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_08.png","sha256":"dc0296b0948001ef8be5819e5a60d71eae75019513ed2936134d54fd20bf58c0","file":"frame_08.png","bounds":[84,158,492,470]},{"index":9,"phase":"Knee drive","durationMs":65,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_09.png","sha256":"f9bc2947fbabfa493f4c5e2369479257c7f7b4d97372742264f6493438854b6f","file":"frame_09.png","bounds":[85,150,477,470]},{"index":10,"phase":"Leg reach","durationMs":55,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_10.png","sha256":"48d31e47f632eceac881afe84fbe6a70871d5a6664df479d9df4ba7eb42220c8","file":"frame_10.png","bounds":[84,133,490,462]},{"index":11,"phase":"First flight","durationMs":70,"source":"design/sprites/smooth/sora/replacement_work/ready/run_start/direct_imagegen_trial/whole_figure_review_v3/frame_11.png","sha256":"cb54c1d39b5ea7a83a1bd053bd876a49391993d0ea2bec8a1d36472f1c6e737c","file":"frame_11.png","bounds":[82,143,469,458]}];
const large=document.getElementById('large'),small=document.getElementById('small'),scrub=document.getElementById('scrub'),readout=document.getElementById('readout');
let current=0,timer=null,runToken=0;
const preload=frames.map(f=>{const image=new Image();image.src=f.file;return image;});
const buttons=frames.map((f,i)=>{const button=document.createElement('button');button.type='button';button.title=f.phase;button.setAttribute('aria-label',`Frame ${i}: ${f.phase}`);button.innerHTML=`<img src="${f.file}" alt=""><span>${String(i).padStart(2,'0')}</span>`;button.onclick=()=>{stop();show(i);};document.getElementById('thumbs').append(button);return button;});
function show(i){current=i;large.src=small.src=frames[i].file;scrub.value=i;readout.textContent=`${String(i).padStart(2,'0')} / ${frames[i].phase}`;buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));}
function stop(){runToken++;clearTimeout(timer);timer=null;}
function schedule(token){if(token!==runToken)return;timer=setTimeout(()=>{if(token!==runToken)return;if(current===frames.length-1){timer=null;return;}show(current+1);schedule(token);},frames[current].durationMs*Number(document.getElementById('speed').value));}
document.getElementById('play').onclick=async()=>{stop();const token=runToken;await Promise.all(preload.map(im=>im.decode()));if(token!==runToken)return;show(0);schedule(token);};
document.getElementById('pause').onclick=stop;scrub.oninput=()=>{stop();show(Number(scrub.value));};show(0);
</script></html>
