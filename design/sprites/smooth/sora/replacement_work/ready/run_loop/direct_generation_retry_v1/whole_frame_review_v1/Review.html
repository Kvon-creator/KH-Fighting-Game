<script>
const run=[{"durationMs":80,"file":"sora_run_loop_00.png"},{"durationMs":80,"file":"sora_run_loop_01.png"},{"durationMs":80,"file":"sora_run_loop_02.png"},{"durationMs":80,"file":"sora_run_loop_03.png"},{"durationMs":80,"file":"sora_run_loop_04.png"},{"durationMs":80,"file":"sora_run_loop_05.png"},{"durationMs":80,"file":"sora_run_loop_06.png"},{"durationMs":80,"file":"sora_run_loop_07.png"},{"durationMs":80,"file":"sora_run_loop_08.png"},{"durationMs":80,"file":"sora_run_loop_09.png"},{"durationMs":80,"file":"sora_run_loop_10.png"},{"durationMs":80,"file":"sora_run_loop_11.png"}],stop=[{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_00.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_01.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_02.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_03.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_04.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_05.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_06.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_07.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_08.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_09.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_10.png"},{"durationMs":100,"file":"../../../run_stop/direct_generation_retry_v1/whole_frame_review_v1/sora_run_stop_11.png"}];const q=s=>document.querySelector(s),images=new Map();let timer=null,index=0,slow=false,playing=false;const sequence=()=>q('#kind').value==='stop'?stop:run;
