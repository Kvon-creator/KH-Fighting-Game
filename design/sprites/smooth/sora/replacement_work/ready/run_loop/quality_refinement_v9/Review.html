<!doctype html><html lang="en"><meta charset="utf-8"><title>Sora run and stop review</title>
<style>body{font:16px system-ui;background:#242b36;color:#f2f4f6;margin:24px}h1{font-size:23px}button,select{padding:9px;margin:3px;border-radius:5px;border:0}#views{display:flex;align-items:end;gap:24px;flex-wrap:wrap}figure{margin:14px 0}canvas{background:#fff;border:1px solid #606873}input{width:510px;max-width:90vw}small{color:#c2cad6}#large{width:min(512px,85vw);height:auto}</style>
<h1>Sora: full run and run stop</h1><p>16 run poses and 16 braking and guard-recovery drawings.</p>
<p><a href="Benchmark_Comparison.png" style="color:#a8d5ff">Open full-size reference / previous / refined comparison</a></p><select id="kind"><option value="run">Run loop</option><option value="stop">Run stop</option></select>
<button id="play">Play</button><button id="join">Run twice â†’ stop</button><button id="pause">Pause</button><button id="slow">Slow: off</button>
<div id="views"><figure><canvas id="large" width="512" height="512"></canvas><figcaption>Working art</figcaption></figure><figure><canvas id="small" width="128" height="128"></canvas><figcaption>128-pixel export size</figcaption></figure></div>
<input type="range" id="scrub" min="0" max="15" value="0"><p id="label"></p>
<small>Flat-canvas motion draft. Compare the loop seam, foot contacts and shoulder carry. Final idle join and material refinement remain; no Godot integration.</small>
<script>
const run=[{"file":"sora_run_loop_00.png","durationMs":60,"phase":"near contact"},{"file":"sora_run_loop_01.png","durationMs":60,"phase":"near compression"},{"file":"sora_run_loop_02.png","durationMs":60,"phase":"near passing"},{"file":"sora_run_loop_03.png","durationMs":60,"phase":"near late passing"},{"file":"sora_run_loop_04.png","durationMs":60,"phase":"near heel-off"},{"file":"sora_run_loop_05.png","durationMs":60,"phase":"near toe-off"},{"file":"sora_run_loop_06.png","durationMs":60,"phase":"first flight"},{"file":"sora_run_loop_07.png","durationMs":60,"phase":"far pre-contact"},{"file":"sora_run_loop_08.png","durationMs":60,"phase":"far contact"},{"file":"sora_run_loop_09.png","durationMs":60,"phase":"far compression"},{"file":"sora_run_loop_10.png","durationMs":60,"phase":"far passing"},{"file":"sora_run_loop_11.png","durationMs":60,"phase":"far late passing"},{"file":"sora_run_loop_12.png","durationMs":60,"phase":"far heel-off"},{"file":"sora_run_loop_13.png","durationMs":60,"phase":"far toe-off"},{"file":"sora_run_loop_14.png","durationMs":60,"phase":"second flight"},{"file":"sora_run_loop_15.png","durationMs":60,"phase":"near pre-contact"}],stop=[{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_00.png","durationMs":60,"phase":"near contact"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_01.png","durationMs":70,"phase":"braking compression"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_02.png","durationMs":70,"phase":"rear foot approaches"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_03.png","durationMs":70,"phase":"rear foot catches"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_04.png","durationMs":70,"phase":"weight recovers"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_05.png","durationMs":70,"phase":"blade clears shoulder"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_06.png","durationMs":70,"phase":"carry lifts clear"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_07.png","durationMs":70,"phase":"blade turns forward"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_08.png","durationMs":70,"phase":"recovery step reaches"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_09.png","durationMs":70,"phase":"recovery heel plants"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_10.png","durationMs":70,"phase":"guard lowers"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_11.png","durationMs":70,"phase":"empty hand approaches"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_12.png","durationMs":70,"phase":"second hand braces"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_13.png","durationMs":80,"phase":"guard settles"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_14.png","durationMs":80,"phase":"cloth follows through"},{"file":"../../run_stop/quality_refinement_v9/sora_run_stop_15.png","durationMs":140,"phase":"ready hold"}];
const images=new Map(),large=document.querySelector('#large'),small=document.querySelector('#small'),kind=document.querySelector('#kind'),scrub=document.querySelector('#scrub'),label=document.querySelector('#label');
let sequence=run,index=0,timer=null,slow=false,joinMode=false;
for(const f of [...run,...stop]){const img=new Image();img.src=f.file;img.onload=()=>{if(sequence[index]===f)draw()};images.set(f.file,img);}
function halt(){clearTimeout(timer);timer=null;joinMode=false;}
function draw(){const f=sequence[index],img=images.get(f.file);for(const c of [large,small]){const g=c.getContext('2d');g.fillStyle='white';g.fillRect(0,0,c.width,c.height);if(img.complete&&img.naturalWidth)g.drawImage(img,0,0,c.width,c.height);}scrub.value=index%16;label.textContent=`${joinMode?'Run â†’ stop':kind.value==='run'?'Run':'Stop'} Â· ${String(index%16).padStart(2,'0')} Â· ${f.phase} Â· ${f.durationMs}ms`;}
function tick(){draw();timer=setTimeout(()=>{if(index+1<sequence.length){index++;tick();}else if(!joinMode&&kind.value==='run'){index=0;tick();}else{timer=null;joinMode=false;}},sequence[index].durationMs*(slow?3:1));}
kind.onchange=()=>{halt();sequence=kind.value==='run'?run:stop;index=0;draw();};
scrub.oninput=()=>{halt();sequence=kind.value==='run'?run:stop;index=Number(scrub.value);draw();};
document.querySelector('#play').onclick=()=>{halt();sequence=kind.value==='run'?run:stop;if(index>=sequence.length-1)index=0;tick();};
document.querySelector('#join').onclick=()=>{halt();sequence=[...run,...run,...stop];index=0;joinMode=true;tick();};
document.querySelector('#pause').onclick=halt;
document.querySelector('#slow').onclick=()=>{slow=!slow;document.querySelector('#slow').textContent=`Slow: ${slow?'on':'off'}`;};draw();
</script></html>
